<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Tech Week 活动地图</title>
<!--
  可缩放的街道底图版活动地图（MapLibre + OpenFreeMap，无需 key）。与 index.html 共用 data.js。
  地图标记 = 街区标签的中心点（官网没有具体地址），缩小时相邻街区自动合并。
  左侧整合筛选、活动和分析；地图上的数量决定标记大小和颜色。
  URL 参数：?theme=light|dark|auto
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
<style>
:root {
  --ground: #eef4f3;
  --panel: #ffffff;
  --panel-2: #f4f7f7;
  --ink: #15201f;
  --ink-2: #4a5857;
  --ink-3: #82908f;
  --rule: #e0e8e7;
  --accent: #2a78d6;
  --accent-soft: #e2eefb;
  --st-open: #2a78d6;
  --st-wait: #eda100;
  --st-full: #eb6834;
  --st-closed: #d03b3b;
  --st-unknown: #9aa1ad;
  --density-low: #2a78d6;
  --density-mid: #f3ca47;
  --density-high: #e34948;
  --shadow: 0 1px 2px rgb(21 32 31 / 6%), 0 8px 28px rgb(21 32 31 / 10%);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1116; --panel: #161b22; --panel-2: #1c222b; --ink: #eef1f6; --ink-2: #b3bac6; --ink-3: #7e8696;
    --rule: #262d38; --accent: #5598e7; --accent-soft: #1b2d44;
    --st-open: #3987e5; --st-wait: #c98500; --st-full: #d95926; --st-closed: #e66767; --st-unknown: #6d7482;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 28px rgb(0 0 0 / 35%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1116; --panel: #161b22; --panel-2: #1c222b; --ink: #eef1f6; --ink-2: #b3bac6; --ink-3: #7e8696;
  --rule: #262d38; --accent: #5598e7; --accent-soft: #1b2d44;
  --st-open: #3987e5; --st-wait: #c98500; --st-full: #d95926; --st-closed: #e66767; --st-unknown: #6d7482;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 28px rgb(0 0 0 / 35%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--f-body); }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(440px, 490px) minmax(0, 1fr); gap: 12px; height: 100dvh; padding: 12px; }
.map-column { position: relative; grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.map-toolbar { flex: none; display: grid; gap: 10px; padding: 12px 16px 14px; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
.toolbar-row { display: flex; align-items: center; gap: 10px; }
.toolbar-label { font: 500 10.5px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.map-stage { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; overflow: hidden; border: 1px solid var(--rule); border-radius: 16px; }

/* floating info card */
.card { position: absolute; z-index: 2; left: 14px; top: 14px; width: 340px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 16px 14px; }
.eyebrow { font: 500 11px/1.5 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { font: 700 21px/1.25 var(--f-body); margin: 6px 0 12px; letter-spacing: -.01em; }
.title-count { color: #e34948; font-size: 1.5em; line-height: 1; }
.product-promise { margin: -4px 0 0; color: var(--ink-2); font-size: 12.5px; }
.label { font: 500 11px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); margin: 12px 0 6px; text-transform: uppercase; }
.days { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.days button { border: 0; background: transparent; padding: 6px 0; font-size: 12.5px; color: var(--ink-2); cursor: pointer; line-height: 1.15; }
.days button small { display: block; font: 400 10px var(--f-mono); color: var(--ink-3); }
.days button + button { border-left: 1px solid var(--rule); }
.days button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.days button[aria-pressed="true"] small { color: var(--ink-2); }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

.seg { display: flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.seg button { border: 0; background: transparent; min-width: 30px; height: 26px; padding: 0 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-3); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.basemap { font: 500 9px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; }
.map-controls { position: absolute; z-index: 3; right: 12px; bottom: 34px; display: grid; justify-items: start; gap: 6px; padding: 6px 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--rule); border-radius: 9px; box-shadow: var(--shadow); }
.map-stats { position: absolute; z-index: 3; top: 12px; right: 58px; width: min(360px, calc(100% - 76px)); padding: 14px 16px; background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
.map-stats .count { margin: 0 0 10px; }
.map-stats .offnote { margin-top: 10px; }


/* sidebar */
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--rule); }
.side-top { padding: 14px 16px 0; }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); font-size: 14px; }
.search:focus, button:focus-visible, .ev:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 8px 10px 9px; font-size: 13.5px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.pane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pane[hidden] { display: none; }
.side-head { padding: 0 16px 12px; border-bottom: 1px solid var(--rule); }
.count { font: 700 16px/1.3 var(--f-body); margin: 14px 0 10px; }
.count .num { font-family: var(--f-mono); font-weight: 500; }
.chips:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 12.5px; }
.chip button { border: 0; background: transparent; cursor: pointer; font-size: 14px; line-height: 1; color: var(--ink-2); padding: 2px 4px; }
.bar { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font: 400 11.5px var(--f-mono); color: var(--ink-3); }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.offnote { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.offnote button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; }
.personalize { position: relative; margin-top: 18px; padding: 14px; overflow: hidden; border: 1px solid #b8d5f5; border-radius: 12px; background: linear-gradient(145deg, var(--accent-soft), var(--panel) 72%); }
.personalize::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent); }
.profile-group + .profile-group { margin-top: 11px; }
.profile-label { display: block; margin-bottom: 6px; font: 500 10px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.profile-options { display: flex; flex-wrap: wrap; gap: 5px; }
.profile-option { border: 1px solid var(--rule); border-radius: 999px; padding: 5px 9px; background: var(--panel); color: var(--ink-2); font-size: 11.5px; cursor: pointer; }
.profile-option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #fff; }
.profile-limit { display: block; margin-top: 12px; color: var(--ink-3); font-size: 10px; }

.list { flex: none; overflow: visible; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 13px 16px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.ev:hover { background: var(--panel-2); }
.ev .name { font: 700 14.5px/1.35 var(--f-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .sub { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .st { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.ev .st .d { font-family: var(--f-mono); color: var(--ink-3); font-size: 11.5px; }
.ev .tm { grid-row: 1 / span 2; grid-column: 2; text-align: right; align-self: center; }
.ev.has-note .tm { grid-row: 1 / span 3; }
.ev .tm b { display: block; font: 700 22px/1 var(--f-display); font-stretch: 85%; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ev .tm small { display: block; margin-top: 6px; font: 500 10.5px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); }
.empty { padding: 28px 16px; color: var(--ink-3); font-size: 13.5px; text-align: center; }
.more { padding: 14px; text-align: center; font-size: 12px; color: var(--ink-3); }

/* insights pane */
.insights { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 10px 11px; }
.fact b { display: block; font: 700 24px/1 var(--f-display); font-stretch: 85%; color: var(--accent); letter-spacing: -.01em; }
.fact span { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--ink-2); }
.sec { margin-top: 22px; }
.sec h2 { font: 700 14.5px/1.3 var(--f-body); margin: 0 0 4px; }
.sec .hint { font-size: 12px; line-height: 1.55; color: var(--ink-3); margin: 0 0 10px; }
.hourhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
svg.hours { width: 100%; height: auto; display: block; }
.hbar { fill: var(--accent); }
.hbar.dim { opacity: .3; }
.hgrid { stroke: var(--rule); stroke-width: 1; }
.axis { font: 400 10px var(--f-mono); fill: var(--ink-3); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 9px; font-size: 12px; }

.maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--rule); box-shadow: var(--shadow) !important; }
.maplibregl-ctrl-group button + button { border-top-color: var(--rule) !important; }
:root.dark-map .maplibregl-ctrl-icon { filter: invert(1) hue-rotate(180deg); }
.maplibregl-ctrl-attrib { font-size: 10.5px; }
.maplibregl-popup-content { background: var(--panel); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; font: 13px/1.45 var(--f-body); }
.maplibregl-popup-tip { display: none; }
.pop b { font-size: 14px; }
.pop .m { font-family: var(--f-mono); color: var(--ink-2); font-size: 12px; }
.pop-detail { min-width: 245px; max-width: 290px; }
.pop-detail .pop-sub { color: var(--ink-3); font-size: 11.5px; margin: 9px 0 4px; }
.pop-topic { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; margin-top: 6px; font-size: 11.5px; }
.pop-topic span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop-topic strong { font: 600 11.5px var(--f-mono); }
.pop-topic i { grid-column: 1 / -1; display: block; height: 3px; border-radius: 2px; background: var(--accent); }
.pop-note { color: var(--ink-3); font-size: 10.5px; margin-top: 9px; }
.loadfail { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 14px; text-align: center; padding: 24px; }

/* One information rail; the map is the entire right-hand canvas. */
.side { grid-column: 1; grid-row: 1; overflow-y: auto; border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
.card { position: static; width: auto; border: 0; border-radius: 0; box-shadow: none; padding: 0; }
.map-filters { display: grid; gap: 12px; }
.map-filters h2 { margin: 0; font: 700 12px var(--f-body); }
.filter-row { display: flex; align-items: flex-end; gap: 12px 18px; flex-wrap: wrap; }
.filter-unit { display: grid; gap: 7px; min-width: 0; }
.filter-unit > .label, .filter-unit > .filter-label { flex: none; margin: 0; white-space: nowrap; }
.filter-unit .days { width: 390px; max-width: 100%; }
.map-filters .filter-unit { width: 100%; }
.map-filters .topic { padding: 5px 8px; font-size: 11.5px; }
.map-filters .topic small { font-size: 9px; }
.map-filters .topics, .map-filters .filter-options { gap: 6px; }
.map-filters .check { margin: 0 0 1px; white-space: nowrap; }
.schedule-row .filter-unit { width: auto; }
.schedule-row .schedule-time { flex: 0 0 auto; min-width: 420px; }
.schedule-row > .schedule-check { align-self: end; margin: 0 0 7px; }
.rail-heading { padding: 20px 20px 4px; }
.side-top { padding: 16px 20px 0; }
.pane { flex: none; }
.side-head { padding: 0 20px 12px; }
.list { flex: none; max-height: none; min-height: 0; }
.ev { padding-inline: 20px; }
.insights { overflow: visible; padding: 20px; border-top: 1px solid var(--rule); }
.insights > h2 { margin: 0 0 14px; font-size: 18px; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topic { border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.25; cursor: pointer; }
.topic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.topic small { font: 400 10px var(--f-mono); opacity: .7; margin-left: 3px; }
.topic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filter-label { font: 500 11px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); margin: 14px 0 6px; text-transform: uppercase; }
.filter-options { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-options .topic { background: var(--panel); }
.filter-options .topic[aria-pressed="true"] { background: var(--accent); color: #fff; }
.side-top { margin-top: 0; padding-top: 12px; border-top: 0; }
.tabs { margin-top: 14px; }
.pane[hidden] { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; gap: 10px; height: auto; min-height: 100dvh; padding: 8px; }
  .map-column { grid-column: 1; grid-row: 1; }
  .map-stage { min-height: 46dvh; }
  .side { grid-column: 1; grid-row: 2; overflow: visible; }
  .filter-unit { flex-wrap: wrap; width: 100%; }
  .filter-unit .days { width: 100%; }
  .schedule-row .filter-unit, .schedule-row .schedule-time { width: 100%; min-width: 0; }
  .map-controls { position: fixed; right: 10px; bottom: 10px; }
  .map-stats { top: 10px; right: 52px; width: calc(100% - 64px); }
  h1 { font-size: 17px; margin: 4px 0 8px; }
  .days button { font-size: 12px; }
}

/* 2026-09 redesign: full-bleed map with floating cockpit cards. */
:root,
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #020308;
  --panel: rgb(15 16 24 / 78%);
  --panel-2: rgb(26 28 39 / 72%);
  --ink: #f6f0e8;
  --ink-2: #c9beb3;
  --ink-3: #8f8782;
  --rule: rgb(255 224 184 / 16%);
  --accent: #ffb36a;
  --accent-soft: rgb(255 179 106 / 15%);
  --st-open: #54a2ff;
  --st-wait: #f6b23c;
  --st-full: #ff734d;
  --st-closed: #ff4e64;
  --st-unknown: #8b92a3;
  --shadow: 0 18px 70px rgb(0 0 0 / 52%), inset 0 1px 0 rgb(255 255 255 / 8%);
}
html, body { background: #020308; overflow: hidden; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 18%, rgb(255 76 66 / 19%), transparent 34%),
    radial-gradient(circle at 76% 24%, rgb(52 144 255 / 18%), transparent 30%),
    radial-gradient(circle at 54% 76%, rgb(255 179 106 / 10%), transparent 38%),
    linear-gradient(180deg, rgb(2 3 8 / 20%), rgb(2 3 8 / 74%));
}
.app {
  position: relative;
  z-index: 1;
  display: block;
  height: 100dvh;
  padding: 0;
  background: #020308;
}
.map-column,
.map-stage,
#map {
  position: absolute;
  inset: 0;
  min-height: 0;
  border: 0;
  border-radius: 0;
}
#map {
  filter: saturate(1.18) contrast(1.08) brightness(.78);
}
.map-toolbar {
  position: fixed;
  z-index: 5;
  left: clamp(380px, 32vw, 500px);
  right: 24px;
  bottom: 24px;
  display: block;
  padding: 14px 18px 16px;
  border: 1px solid var(--rule);
  border-radius: 0;
  background: linear-gradient(180deg, rgb(22 20 27 / 82%), rgb(8 8 14 / 78%));
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.15);
}
.map-toolbar::before,
.side::before,
.map-stats::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border: 1px solid rgb(255 255 255 / 6%);
}
.map-filters { gap: 10px; }
.filter-row { gap: 10px 14px; }
.filter-label,
.label,
.profile-label {
  color: #c9a27c;
  letter-spacing: .18em;
}
.filter-unit .days { width: min(540px, 42vw); }
.days,
.topic,
.filter-options .topic,
.profile-option,
.search,
.seg,
.btn {
  border-color: rgb(255 224 184 / 18%);
  background: rgb(255 255 255 / 5%);
  color: var(--ink-2);
  border-radius: 9px;
}
.days button {
  color: var(--ink-2);
  text-transform: uppercase;
}
.days button small,
.topic small { color: rgb(246 240 232 / 52%); }
.days button[aria-pressed="true"],
.topic[aria-pressed="true"],
.filter-options .topic[aria-pressed="true"],
.profile-option[aria-pressed="true"] {
  background: linear-gradient(180deg, rgb(255 179 106 / 90%), rgb(178 83 43 / 90%));
  border-color: rgb(255 206 153 / 70%);
  color: #120b08;
  box-shadow: 0 0 26px rgb(255 117 67 / 24%);
}
.map-stats {
  top: 24px;
  right: 24px;
  width: min(390px, calc(100vw - 440px));
  padding: 18px 20px;
  border-radius: 0;
  border-color: var(--rule);
  background: linear-gradient(180deg, rgb(16 17 26 / 82%), rgb(8 8 14 / 78%));
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.1);
}
.map-stats .count {
  font: 800 20px/1.15 var(--f-display);
  letter-spacing: -.02em;
}
.bar { height: 9px; border-radius: 0; background: rgb(255 255 255 / 7%); }
.legend,
.offnote { color: var(--ink-2); }
.offnote button { color: #ffbd7d; }
.map-controls {
  right: 24px;
  bottom: 170px;
  border-radius: 0;
  background: rgb(10 11 18 / 72%);
  border-color: var(--rule);
  backdrop-filter: blur(14px);
}
.basemap { color: #b99a79; }
.side {
  position: fixed;
  z-index: 6;
  top: 24px;
  left: 24px;
  bottom: 24px;
  width: clamp(330px, 28vw, 440px);

  .side-head,
  .map-toolbar,
  .map-search,
  .replay-panel {
    position: relative;
    inset: auto;
    width: auto;
    transform: none !important;
    margin: 10px;
  }
  .pane {
    position: fixed;
    inset: 10px 10px auto auto;
    width: min(360px, calc(100vw - 20px));

<script>
(() => {
  const TW = window.TW;

  // ---------- i18n ----------

      topic: "官方主题 · 23", allTopics: "全部主题",

      popHood: (h, n) => `<b>${h}</b><div class="m">${n} 场 · 点击只看这里</div>`,
      popTopics: "占比最高的 5 个主题", popMulti: "一场活动可属于多个主题", popNoTopics: "这些活动没有主题标签",
      loadfail: "底图库加载失败（需要联网）。<br>左侧列表仍可使用。",

      hourTitle: (s) => `开始时间 · ${s}`, allDay: "全天", play: "▶ 播放一天", pause: "❚❚ 暂停",
      hourNote: "点柱子只看那一小时开始的活动（地图和列表一起变）；4 场 0–6 点开始的时间存疑，不计入。",
      hourAria: (h, c) => `${h}:00 开始 ${c} 场`, hourTip: (h, c) => `<b>${h}:00–${h}:59 开始</b><br>${c} 场`,
      mapReplay: "Replay", mapPause: "Pause", replayStatic: "全周静态视图", replayEmpty: "当前筛选下没有可播放的定时活动",
      replayAt: (day, time, at, total) => `${day} · ${time} · ${at}/${total}`,
    },
    en: {
      pageTitle: "SF Tech Week Event Guide", htmlLang: "en",
      eyebrow: "SF Tech Week | Oct 5–11, 2026",
      title: () => "1700+ events",
      productPromise: "Find the events worth your time.",
      filters: "Filters", date: "Date", allWeek: "All", days7: "7 days", days: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
      topic: "Topics", allTopics: "All topics",
      timeRange: "Start time", allTimes: "Any time", timeLabels: ["BEFORE 8AM", "8AM–12PM", "12PM–5PM", "AFTER 5PM"],
      format: "Type", allFormats: "All types",
      whoLabel: "Who are you?", goalLabel: "What are you looking for?", profileLimit: "Up to 2 roles · 3 goals", resetProfile: "Reset", resetAllFilters: "Reset all filters",
      light: "Light", dark: "Dark", auto: "Match system", theme: "Theme", language: "Language",
      search: "Search event or host", tabEvents: "Events", tabInsights: "Insights", sideLabel: "Events and insights",
      count: (n, w) => `<span class="num">${n}</span> events ${w}`,
      inView: "in map area", inViewOff: "in map area (incl. virtual / unknown)", inHood: (h) => `in ${h}`,
      chipHood: (h) => `Only ${h}`, chipHour: (h) => `Starts ${h}:00`, clear: "Clear filter",
      offIn: (n) => `Including ${n} virtual / unknown · `, offBtnOut: "Exclude",
      offOut: (n) => `${n} virtual / unknown events are not on the map · `, offBtnIn: "Add to list",
      empty: "No events here with these filters. Try panning or zooming out.",
      moreRows: (a, b) => `Showing ${a} of ${b} — scroll for more`, suspect: "start time uncertain",
      status: { open: "Open", waitlist: "Waitlist", sold_out: "Sold out", closed: "Closed", unknown: "Unknown" },
      popCluster: (n, c) => `<b>${n} events</b><div class="m">${c} neighborhoods · click to zoom</div>`,
      popHood: (h, n) => `<b>${h}</b><div class="m">${n} events · click to filter</div>`,
      popTopics: "Top 5 themes by share", popMulti: "An event may have multiple topics", popNoTopics: "These events have no topic tags",
      loadfail: "The map library failed to load (needs internet).<br>The left-hand list still works.",
      f1: "of events are in three adjacent neighborhoods: SOMA, FiDi, Downtown",
      f2: "official topics can be filtered directly",
      f3: "of events start 17:00–18:59 — time is more concentrated than place",
      hourTitle: (s) => `Start time · ${s}`, allDay: "All day", play: "▶ Play a day", pause: "❚❚ Pause",
      hourNote: "Click a bar to filter by start hour (map and list update). 4 events starting 0–6am have uncertain times and are excluded.",
      hourAria: (h, c) => `${c} events start at ${h}:00`, hourTip: (h, c) => `<b>Starts ${h}:00–${h}:59</b><br>${c} events`,
      mapReplay: "Replay", mapPause: "Pause", replayStatic: "Full-week static view", replayEmpty: "No timed events in this filter",
      replayAt: (day, time, at, total) => `${day} · ${time} · ${at}/${total}`,
    },
  };
  const DATES = ["10/5", "10/6", "10/7", "10/8", "10/9", "10/10", "10/11"];
  const DEFAULT_BOUNDS = [[-122.515, 37.708], [-122.357, 37.812]];
  const STYLES = { light: "https://tiles.openfreemap.org/styles/positron", dark: "https://tiles.openfreemap.org/styles/dark" };
  const PAGE = 120, H0 = 6, H1 = 22;
  const TIME_RANGES = [[0, 8], [8, 12], [12, 17], [17, 24]];
  const CORE3 = ["SOMA", "FiDi", "Downtown"];
  const ROLE_DEFS = [
    ["founder", "Founder", ["Founder"]], ["investor", "Investor", ["Investor"]],
    ["engineer", "Builder", ["Engineer"]], ["pm", "PM", ["PM"]],
    ["marketing", "Marketing", ["Marketing", "Sales"]],
    ["hr", "HR", ["HR"]],
    ["creator", "Creator", ["Creator"]],
  ];
  const GOAL_DEFS = [
    ["funding", "Funding", ["Funding"]], ["networking", "Networking", ["Networking"]],
    ["building", "Building", ["Building"]], ["learning", "Learning", ["Learning"]],
    ["hiring", "Hiring", ["Hiring"]], ["consumer", "Consumer", ["Consumer"]],
    ["entertainment", "Entertainment", ["Entertainment"]],
  ];

  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmt = (n) => n.toLocaleString("en-US");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const params = new URLSearchParams(location.search);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };

  // events: [hood, day, hour, groupedDomainMask, name, host, time, status, url,
  //          officialThemeMask, formatMask, intentMask, audienceMask]
  const ev = TW.events;
  const hoods = TW.hoods;
  const hoodIdx = Object.fromEntries(hoods.map((h, i) => [h.name, i]));
  const searchKey = ev.map((e) => (e[4] + " " + e[5]).toLowerCase());
  const partifulLinks = window.TW_PARTIFUL_LINKS || {};
  const eventMeta = window.TW_EVENT_META || {};
  const eventKey = (e) => `${e[4]}|${e[5]}|${TW.days[e[1]]}|${e[6]}`;
  const eventUrl = (e) => partifulLinks[`${e[4]}|${e[5]}|${TW.days[e[1]]}|${e[6]}`] || e[8];
  const savedProfile = (() => { try { return JSON.parse(store.get("tw-profile") || "null"); } catch { return null; } })();
  const savedRoles = [...new Set((savedProfile?.roles || []).map((x) => x === "sales" ? "marketing" : x))]
    .filter((x) => ROLE_DEFS.some((r) => r[0] === x));
  const savedGoals = [...new Set((savedProfile?.goals || []).map((x) => x === "customer" ? "consumer" : x))]
    .filter((x) => GOAL_DEFS.some((g) => g[0] === x));
  const state = {
    day: -1, domain: -1, format: -1, timeRange: -1, hour: null, openOnly: false, q: "", hood: null, shown: PAGE, includeOff: false,
    tab: "events", playing: null,
    roles: savedRoles, goals: savedGoals,
    lang: "en",
    replay: { active: false, cutoff: null, index: 0, slots: [], timer: null, empty: false },
  };
  let T = I18N[state.lang];
  const dName = (d) => d;
  const tagMask = (universe, tags) => tags.reduce((m, tag) => {
    const i = universe.indexOf(tag); return i < 0 ? m : m | (1 << i);
  }, 0);
  const roleMasks = Object.fromEntries(ROLE_DEFS.map(([id, label, tags]) => [id, { label, mask: tagMask(TW.audiences || [], tags) }]));
  const goalMasks = Object.fromEntries(GOAL_DEFS.map(([id, label, tags]) => [id, { label, mask: tagMask(TW.intents || [], tags) }]));
  const eventMinutes = ev.map((e) => {
    if (e[2] < 0) return null;
    const m = /^(\d{1,2}):(\d{2})/.exec(e[6]);
    if (!m) return null;
    return e[1] * 1440 + (+m[1]) * 60 + (+m[2]);
  });

  function profileMatch(e) {
    const roleHits = state.roles.filter((id) => e[12] & roleMasks[id].mask);
    const goalHits = state.goals.filter((id) => e[11] & goalMasks[id].mask);
    const hasProfile = state.roles.length || state.goals.length;
    const qualified = !!hasProfile && (!state.roles.length || roleHits.length > 0) && (!state.goals.length || goalHits.length > 0);
    return { qualified, score: roleHits.length * 2 + goalHits.length * 3, roleHits, goalHits };
  }

  // ---------- filtering ----------
  function passes(i, { useDomain = true, useHour = true, useTimeline = true } = {}) {
    const e = ev[i];
    return (state.day < 0 || e[1] === state.day) &&
      (!useDomain || state.domain < 0 || (e[9] & (1 << state.domain))) &&
      (state.format < 0 || (e[10] & (1 << state.format))) &&
      (state.timeRange < 0 || (e[2] >= TIME_RANGES[state.timeRange][0] && e[2] < TIME_RANGES[state.timeRange][1])) &&
      (!useHour || state.hour === null || e[2] === state.hour) &&
      (!state.openOnly || e[7] === "open") &&
      (!(state.roles.length || state.goals.length) || profileMatch(e).qualified) &&
      (!state.q || searchKey[i].includes(state.q)) &&
      (!useTimeline || !state.replay.active || (eventMinutes[i] !== null && eventMinutes[i] <= state.replay.cutoff));
  }

  // ---------- static text ----------
  function applyLang() {
    T = I18N[state.lang];
    document.documentElement.lang = T.htmlLang;
    document.title = T.pageTitle;
    document.querySelectorAll("[data-i18n]").forEach((n) => (n.textContent = T[n.dataset.i18n]));
    document.querySelectorAll("[data-i18n-html]").forEach((n) => (n.innerHTML = T[n.dataset.i18nHtml]));
    document.querySelectorAll("[data-i18n-aria]").forEach((n) => n.setAttribute("aria-label", T[n.dataset.i18nAria]));
    document.querySelector(".eyebrow").innerHTML = '<span class="hot-count">1700+</span> events | SF Tech Week<span class="event-date">Oct 5–11, 2026</span>';
    $("title").innerHTML = '<span class="title-count">1700+ events</span>';
    $("q").placeholder = T.search; $("q").setAttribute("aria-label", T.search);
    $("days").setAttribute("aria-label", T.date);
    $("domain").setAttribute("aria-label", T.topic);
    $("timeRange").setAttribute("aria-label", T.timeRange);
    $("formats").setAttribute("aria-label", T.format);
    $("side").setAttribute("aria-label", T.sideLabel);
    $("theme").setAttribute("aria-label", T.theme);
    document.querySelectorAll("#theme button").forEach((b) => { b.title = T[b.dataset.t]; b.setAttribute("aria-label", T[b.dataset.t]); });
    updateReplayPanel();
    buildDays();
    buildDomainButtons();
    buildTimeRangeButtons();
    buildFormatButtons();
    renderProfile();
    $("play").textContent = state.playing ? T.pause : T.play;
    const lf = document.querySelector(".loadfail");
    if (lf) lf.innerHTML = T.loadfail;
  }
  function buildDays() {
    const days = $("days");
    days.textContent = "";
    T.days.map((d, i) => [d, DATES[i], i]).forEach(([t, s, i]) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `${t}<small>${s}</small>`;
      b.setAttribute("aria-label", `${t} ${s}`.trim());
      b.setAttribute("aria-pressed", i === state.day);
      b.onclick = () => userFilterUpdate(() => { state.day = state.day === i ? -1 : i; });
      days.appendChild(b);
    });
  }
  const domCount = TW.themes.map((d, i) => ev.filter((e) => e[9] & (1 << i)).length);
  const formatCount = TW.formats.map((f, i) => ev.filter((e) => e[10] & (1 << i)).length);
  const featuredFormats = ["Hackathon", "Networking", "Panel / Fireside Chat", "Experiential"];
  function buildDomainButtons() {
    $("domain").innerHTML = `<option value="-1">${T.allTopics}</option>` +
      TW.themes.map((d, i) => `<option value="${i}">${esc(dName(d))} (${domCount[i]})</option>`).join("");
    $("domain").value = String(state.domain);
    $("domain").onchange = (e) => userFilterUpdate(() => { state.domain = +e.target.value; });
  }
  function buildTimeRangeButtons() {
    $("timeRange").innerHTML = T.timeLabels.map((label, i) => `<button class="topic" type="button" data-r="${i}" aria-pressed="${state.timeRange === i}">${label}</button>`).join("");
    $("timeRange").querySelectorAll("button").forEach((b) => b.onclick = () => {
      const next = +b.dataset.r;
      userFilterUpdate(() => {
        state.hour = null;
        state.timeRange = state.timeRange === next ? -1 : next;
      });
    });
  }
  function buildFormatButtons() {
    $("formats").innerHTML = `<option value="-1">${T.allFormats}</option>` +
      TW.formats.map((f, i) => [f, i]).sort((a, b) => {
        const ai = featuredFormats.indexOf(a[0]), bi = featuredFormats.indexOf(b[0]);
        return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || a[1] - b[1];
      }).map(([f, i]) => `<option value="${i}">${esc(f)} (${formatCount[i]})</option>`).join("");
    $("formats").value = String(state.format);
    $("formats").onchange = (e) => userFilterUpdate(() => { state.format = +e.target.value; });
  }
  function saveProfile() {
    store.set("tw-profile", JSON.stringify({ roles: state.roles, goals: state.goals }));
  }
  function choiceButtons(defs, selected, kind) {
    return defs.map(([id, label]) => `<button class="profile-option" type="button" data-kind="${kind}" data-id="${id}" aria-pressed="${selected.includes(id)}">${label}</button>`).join("");
  }
  function renderProfile() {
    $("roleOptions").innerHTML = choiceButtons(ROLE_DEFS, state.roles, "roles");
    $("goalOptions").innerHTML = choiceButtons(GOAL_DEFS, state.goals, "goals");
    document.querySelectorAll(".profile-option").forEach((b) => b.onclick = () => {

    });
    counts.forEach((c, j) => {
      const h = H0 + j, bh = (c / nice) * (y0 - y1);
      const r = svgEl("rect", {
        x: (x0 + j * bw + 1.5).toFixed(1), y: (y0 - bh).toFixed(1), width: (bw - 3).toFixed(1), height: Math.max(0, bh).toFixed(1), rx: 2,
        class: "hbar" + (state.hour === null || state.hour === h ? "" : " dim"), tabindex: 0, role: "button", "aria-label": T.hourAria(h, c),
      }, hs);
      const hit = svgEl("rect", { x: x0 + j * bw, y: y1, width: bw, height: y0 - y1, fill: "transparent", style: "cursor:pointer" }, hs);
      const pick = () => {
        userControlled = true;
        stopPlay();
        stopMapReplay({ clear: true, doUpdate: false });
        state.timeRange = -1;
        state.hour = state.hour === h ? null : h;
        update();
      };
      [r, hit].forEach((n) => {
        n.addEventListener("click", pick);
        n.addEventListener("pointermove", (evt) => showTip(evt, T.hourTip(h, fmt(c))));
        n.addEventListener("pointerleave", hideTip);
      });
      r.addEventListener("keydown", (evt) => { if (evt.key === "Enter" || evt.key === " ") { evt.preventDefault(); pick(); } });
      if (h % 3 === 0) svgEl("text", { x: x0 + j * bw + bw / 2, y: y0 + 14, "text-anchor": "middle", class: "axis" }, hs).textContent = h;
    });
    svgEl("line", { x1: x0, x2: x1, y1: y0, y2: y0, stroke: "var(--ink-3)", "stroke-width": 1 }, hs);
    $("hours").setAttribute("aria-label", T.hourTitle(T.allDay));
    $("hourtitle").textContent = T.hourTitle(state.hour !== null ? `${state.hour}:00–${state.hour}:59` : state.timeRange >= 0 ? T.timeLabels[state.timeRange] : T.allDay) +
      (state.hood !== null ? ` · ${hoods[state.hood].name}` : "");
  }
  function drawInsights() { drawFacts(); drawHours(); }

  const playBtn = $("play");
  function stopPlay() {
    if (state.playing) { clearInterval(state.playing); state.playing = null; playBtn.textContent = T.play; }
  }
  playBtn.onclick = () => {
    if (state.playing) { stopPlay(); return; }
    userControlled = true;
    stopMapReplay({ clear: true, doUpdate: false });
    state.timeRange = -1;
    state.hour = state.hour === null || state.hour >= H1 ? H0 : state.hour;
    playBtn.textContent = T.pause;
    update();
    state.playing = setInterval(() => {
      if (state.hour >= H1) { stopPlay(); return; }
      state.hour++; update();
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 1400 : 800);
  };
  $("allday").onclick = () => {
    userControlled = true;
    stopPlay();
    stopMapReplay({ clear: true, doUpdate: false });
    state.hour = null;
    state.timeRange = -1;
    update();
  };

  // ---------- map replay ----------
  let userControlled = false, introReplayStarted = false;
  const replayBtn = $("mapReplayBtn");
  const replayTime = $("replayTime");
  const replayFill = $("replayFill");

  function minuteLabel(minute) {
    if (minute === null || minute === undefined) return T.replayStatic;
    const day = Math.floor(minute / 1440);
    const mins = minute % 1440;
    const h = String(Math.floor(mins / 60)).padStart(2, "0");
    const m = String(mins % 60).padStart(2, "0");
    return { day: DATES[day] || "", time: `${h}:${m}` };
  }
  function replaySourceSlots() {
    return [...new Set(ev.map((_, i) => (passes(i, { useTimeline: false }) ? eventMinutes[i] : null))
      .filter((m) => m !== null))].sort((a, b) => a - b);
  }
  function updateReplayPanel() {
    if (!replayBtn || !replayTime || !replayFill) return;
    replayBtn.textContent = state.replay.active ? T.mapPause : T.mapReplay;
    replayBtn.setAttribute("aria-pressed", state.replay.active ? "true" : "false");
    if (state.replay.active) {
      const slot = minuteLabel(state.replay.cutoff);
      replayTime.textContent = T.replayAt(slot.day, slot.time, state.replay.index + 1, state.replay.slots.length);
      const pct = state.replay.slots.length <= 1 ? 100 : state.replay.index / (state.replay.slots.length - 1) * 100;
      replayFill.style.width = `${Math.max(0, Math.min(100, pct))}%`;
    } else {
      replayTime.textContent = state.replay.empty ? T.replayEmpty : T.replayStatic;
      replayFill.style.width = state.replay.empty ? "0%" : "100%";
    }
  }
  function stopMapReplay({ clear = true, doUpdate = false } = {}) {
    if (state.replay.timer) clearInterval(state.replay.timer);
    state.replay.timer = null;
    state.replay.active = false;
    if (clear) {
      state.replay.cutoff = null;
      state.replay.index = 0;
      state.replay.slots = [];
    }
    updateReplayPanel();
    if (doUpdate) update();
  }
  function finishMapReplay() {
    stopMapReplay({ clear: true, doUpdate: true });
  }
  function replayStep() {
    if (!state.replay.active) return;
    if (state.replay.index >= state.replay.slots.length - 1) {
      finishMapReplay();
      return;
    }
    state.replay.index++;
    state.replay.cutoff = state.replay.slots[state.replay.index];
    update();
  }
  function startMapReplay({ auto = false } = {}) {
    stopPlay();
    stopMapReplay({ clear: true, doUpdate: false });
    const slots = replaySourceSlots();
    state.replay.empty = !slots.length;
    if (!slots.length) { updateReplayPanel(); return; }
    state.replay.active = true;
    state.replay.slots = slots;
    state.replay.index = 0;
    state.replay.cutoff = slots[0];
    const duration = auto ? 24000 : 18000;
    const interval = matchMedia("(prefers-reduced-motion: reduce)").matches
      ? 900
      : Math.max(90, Math.min(420, Math.round(duration / Math.max(1, slots.length))));
    update();
    state.replay.timer = setInterval(replayStep, interval);
  }
  function userFilterUpdate(mutator) {
    userControlled = true;
    stopPlay();
    stopMapReplay({ clear: true, doUpdate: false });
    if (mutator) mutator();
    state.replay.empty = false;
    update();
  }
  function maybeStartIntroReplay() {
    if (introReplayStarted || userControlled || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    introReplayStarted = true;
    setTimeout(() => {
      if (!userControlled && map && map.getSource("hoods")) startMapReplay({ auto: true });
    }, 450);
  }
  replayBtn.onclick = () => {
    userControlled = true;
    if (state.replay.active) stopMapReplay({ clear: true, doUpdate: true });
    else startMapReplay();
  };

  // ---------- update loop ----------
  function redrawSide() { drawSide(); if (state.tab === "insights") drawInsights(); }
  function update() {
    document.querySelectorAll("#days button").forEach((b, j) => b.setAttribute("aria-pressed", j === state.day));
    $("domain").value = String(state.domain);
    document.querySelectorAll("#timeRange button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.r === state.timeRange));
    $("formats").value = String(state.format);
    state.shown = PAGE;
    stats = hoodStats();
    if (map && map.getSource("hoods")) { map.getSource("hoods").setData(hoodGeoJSON()); paintBubbles(); }
    if (detailPopup?.isOpen() && state.hood !== null) detailPopup.setHTML(hoodTopicHtml(state.hood));
    updateReplayPanel();
    redrawSide();
  }
  stats = hoodStats();
  applyLang();
  setTheme(themePref());
  setTab("events");
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (themePref() === "auto") setTheme("auto"); });
  update();
})();
</script>
