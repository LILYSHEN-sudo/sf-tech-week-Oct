<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Tech Week 活动地图</title>
<!--
  可缩放的街道底图版活动地图（MapLibre + OpenFreeMap，无需 key）。与 index.html 共用 data.js。
  地图标记 = 街区标签的中心点（官网没有具体地址），缩小时相邻街区自动合并。
  左侧整合筛选、活动和分析；右下角显示所选官方主题的街区分布。
  URL 参数：?lang=en|zh  ?theme=light|dark|auto
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css">
<style>
:root {
  --ground: #eef4f3;
  --panel: #ffffff;
  --panel-2: #f4f7f7;
  --ink: #15201f;
  --ink-2: #4a5857;
  --ink-3: #82908f;
  --rule: #e0e8e7;
  --accent: #2a78d6;
  --accent-soft: #e2eefb;
  --bubble: #ffffff;
  --bubble-edge: #5f9cc9;
  --st-open: #2a78d6;
  --st-wait: #eda100;
  --st-full: #eb6834;
  --st-closed: #d03b3b;
  --st-unknown: #9aa1ad;
  /* diverging lift scale (same cut points as index.html) */
  --lift-hi: #e34948;
  --lift-hi-soft: #f2a3a2;
  --lift-mid: #e6e4df;
  --lift-lo-soft: #86b6ef;
  --lift-lo: #2a78d6;
  --shadow: 0 1px 2px rgb(21 32 31 / 6%), 0 8px 28px rgb(21 32 31 / 10%);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1116; --panel: #161b22; --panel-2: #1c222b; --ink: #eef1f6; --ink-2: #b3bac6; --ink-3: #7e8696;
    --rule: #262d38; --accent: #5598e7; --accent-soft: #1b2d44; --bubble: #26303f; --bubble-edge: #6d8fb3;
    --st-open: #3987e5; --st-wait: #c98500; --st-full: #d95926; --st-closed: #e66767; --st-unknown: #6d7482;
    --lift-hi: #e66767; --lift-hi-soft: #8e3a3a; --lift-mid: #383835; --lift-lo-soft: #1c5cab; --lift-lo: #3987e5;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 28px rgb(0 0 0 / 35%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1116; --panel: #161b22; --panel-2: #1c222b; --ink: #eef1f6; --ink-2: #b3bac6; --ink-3: #7e8696;
  --rule: #262d38; --accent: #5598e7; --accent-soft: #1b2d44; --bubble: #26303f; --bubble-edge: #6d8fb3;
  --st-open: #3987e5; --st-wait: #c98500; --st-full: #d95926; --st-closed: #e66767; --st-unknown: #6d7482;
  --lift-hi: #e66767; --lift-hi-soft: #8e3a3a; --lift-mid: #383835; --lift-lo-soft: #1c5cab; --lift-lo: #3987e5;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 28px rgb(0 0 0 / 35%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font-family: var(--f-body); }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(440px, 490px) minmax(0, 1fr); height: 100dvh; }
#map { position: relative; min-height: 0; }

/* floating info card */
.card { position: absolute; z-index: 2; left: 14px; top: 14px; width: 340px; background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 16px 14px; }
.eyebrow { font: 500 11px/1.5 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { font: 700 21px/1.25 var(--f-body); margin: 6px 0 12px; letter-spacing: -.01em; }
.label { font: 500 11px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); margin: 12px 0 6px; text-transform: uppercase; }
.days { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.days button { border: 0; background: transparent; padding: 6px 0; font-size: 12.5px; color: var(--ink-2); cursor: pointer; line-height: 1.15; }
.days button small { display: block; font: 400 10px var(--f-mono); color: var(--ink-3); }
.days button + button { border-left: 1px solid var(--rule); }
.days button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.days button[aria-pressed="true"] small { color: var(--ink-2); }
select { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); font-size: 13.5px; }
.check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.meta { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 10px; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); }
.meta p { margin: 0 0 4px; }
.fold { display: none; }

.tools { position: absolute; z-index: 2; left: 14px; display: flex; align-items: center; gap: 8px; }
.seg { display: flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.seg button { border: 0; background: transparent; min-width: 30px; height: 26px; padding: 0 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-3); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.basemap { font: 500 10.5px var(--f-mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }

/* lift legend on the map (only while a topic is selected) */
.mlegend { position: absolute; z-index: 2; left: 14px; bottom: 14px; max-width: 320px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; font-size: 12px; color: var(--ink-2); }
.mlegend b { display: block; font-size: 12.5px; color: var(--ink); margin-bottom: 6px; }
.mlegend .sw { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.mlegend .sw span { display: inline-flex; align-items: center; gap: 5px; }
.mlegend i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1px solid rgb(0 0 0 / 12%); }
.mlegend .ring { margin-top: 6px; }
.mlegend .ring i { background: transparent; border: 2px solid var(--ink); }

/* sidebar */
.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-left: 1px solid var(--rule); }
.side-top { padding: 14px 16px 0; }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); font-size: 14px; }
.search:focus, select:focus, button:focus-visible, .ev:focus-visible, th[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--rule); }
.tabs button { border: 0; background: none; padding: 8px 10px 9px; font-size: 13.5px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
.pane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pane[hidden] { display: none; }
.side-head { padding: 0 16px 12px; border-bottom: 1px solid var(--rule); }
.count { font: 700 16px/1.3 var(--f-body); margin: 14px 0 10px; }
.count .num { font-family: var(--f-mono); font-weight: 500; }
.chips:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 6px 3px 10px; border-radius: 999px; background: var(--accent-soft); font-size: 12.5px; }
.chip button { border: 0; background: transparent; cursor: pointer; font-size: 14px; line-height: 1; color: var(--ink-2); padding: 2px 4px; }
.bar { display: flex; gap: 2px; height: 8px; border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend b { font: 400 11.5px var(--f-mono); color: var(--ink-3); }
.dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.offnote { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.offnote button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; }

.list { flex: 1; overflow-y: auto; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 13px 16px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.ev:hover { background: var(--panel-2); }
.ev .name { font: 700 14.5px/1.35 var(--f-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .sub { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .st { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); margin-top: 3px; }
.ev .st .d { font-family: var(--f-mono); color: var(--ink-3); font-size: 11.5px; }
.ev .tm { grid-row: 1 / span 3; grid-column: 2; text-align: right; align-self: center; }
.ev .tm b { display: block; font: 700 22px/1 var(--f-display); font-stretch: 85%; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ev .tm small { display: block; margin-top: 6px; font: 500 10.5px var(--f-mono); letter-spacing: .06em; color: var(--ink-3); }
.empty { padding: 28px 16px; color: var(--ink-3); font-size: 13.5px; text-align: center; }
.more { padding: 14px; text-align: center; font-size: 12px; color: var(--ink-3); }

/* insights pane */
.insights { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 10px 11px; }
.fact b { display: block; font: 700 24px/1 var(--f-display); font-stretch: 85%; color: var(--accent); letter-spacing: -.01em; }
.fact span { display: block; margin-top: 6px; font-size: 11.5px; line-height: 1.45; color: var(--ink-2); }
.sec { margin-top: 22px; }
.sec h2 { font: 700 14.5px/1.3 var(--f-body); margin: 0 0 4px; }
.sec .hint { font-size: 12px; line-height: 1.55; color: var(--ink-3); margin: 0 0 10px; }
.hourhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
svg.hours { width: 100%; height: auto; display: block; }
.hbar { fill: var(--accent); }
.hbar.dim { opacity: .3; }
.hgrid { stroke: var(--rule); stroke-width: 1; }
.axis { font: 400 10px var(--f-mono); fill: var(--ink-3); }
.tblwrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; }
table.hm { border-collapse: separate; border-spacing: 2px; font-variant-numeric: tabular-nums; }
.hm th { font: 500 11px/1.2 var(--f-body); color: var(--ink-2); padding: 3px 5px; white-space: nowrap; }
.hm thead th { text-align: center; vertical-align: bottom; font-size: 10.5px; }
.hm thead th small { display: block; font: 400 9.5px var(--f-mono); color: var(--ink-3); margin-top: 2px; }
.hm tbody th { text-align: left; cursor: pointer; position: sticky; left: 0; background: var(--panel); z-index: 1; }
.hm tbody th:hover { color: var(--ink); text-decoration: underline; }
.hm tr.cur th { color: var(--accent); font-weight: 700; }
.hm td { min-width: 40px; height: 24px; text-align: center; font: 500 10.5px var(--f-mono); border-radius: 4px; }
.hm td.sig { box-shadow: inset 0 0 0 2px var(--ink); font-weight: 700; }
.hm td.near { box-shadow: inset 0 0 0 1px var(--ink-2); background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgb(0 0 0 / 10%) 5px 6px); }
.hm td.low { color: var(--ink-3); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 9px; font-size: 12px; }

.maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--rule); box-shadow: var(--shadow) !important; }
.maplibregl-ctrl-group button + button { border-top-color: var(--rule) !important; }
:root.dark-map .maplibregl-ctrl-icon { filter: invert(1) hue-rotate(180deg); }
.maplibregl-ctrl-attrib { font-size: 10.5px; }
.maplibregl-popup-content { background: var(--panel); color: var(--ink); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px; font: 13px/1.45 var(--f-body); }
.maplibregl-popup-tip { display: none; }
.pop b { font-size: 14px; }
.pop .m { font-family: var(--f-mono); color: var(--ink-2); font-size: 12px; }
.loadfail { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: 14px; text-align: center; padding: 24px; }

/* One information rail; the map is the entire right-hand canvas. */
.side { grid-column: 1; grid-row: 1; overflow-y: auto; border-left: 0; border-right: 1px solid var(--rule); }
#map { grid-column: 2; grid-row: 1; }
.card { position: static; width: auto; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; box-shadow: none; padding: 20px 20px 16px; }
.side-top { padding: 16px 20px 0; }
.pane { flex: none; }
.side-head { padding: 0 20px 12px; }
.list { flex: none; max-height: 36dvh; min-height: 180px; }
.ev { padding-inline: 20px; }
.insights { overflow: visible; padding: 20px; border-top: 1px solid var(--rule); }
.insights > h2 { margin: 0 0 14px; font-size: 18px; }
.tools { top: 14px; left: 14px; }
.topics { display: flex; flex-wrap: wrap; gap: 6px; }
.topic { border: 1px solid var(--rule); background: var(--panel-2); border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.25; cursor: pointer; }
.topic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.topic small { font: 400 10px var(--f-mono); opacity: .7; margin-left: 3px; }
.topic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mini-analysis { position: absolute; z-index: 2; right: 14px; bottom: 32px; width: min(300px, calc(100% - 28px)); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 12px; }
.mini-analysis h2 { margin: 0 0 8px; font-size: 13px; }
.mini-analysis p { margin: 0; color: var(--ink-2); }
.mini-analysis .mini-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-top: 1px solid var(--rule); }
.mini-analysis .mini-row b { font: 500 12px var(--f-mono); white-space: nowrap; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(350px, 56dvh) auto; height: auto; min-height: 100dvh; }
  #map { grid-column: 1; grid-row: 1; }
  .side { grid-column: 1; grid-row: 2; overflow: visible; border-right: 0; border-top: 1px solid var(--rule); }
  .list { max-height: 38dvh; }
  .mini-analysis { bottom: 32px; }
  h1 { font-size: 17px; margin: 4px 0 8px; }
  .days button { font-size: 12px; }
  .mlegend { left: 10px; bottom: 10px; right: 10px; max-width: none; }
}
</style>
<body>
<div class="app">
  <div id="map">
    <div class="tools" id="tools">
      <div class="seg" id="theme" role="group">
        <button type="button" data-t="light">☀</button>
        <button type="button" data-t="dark">☾</button>
        <button type="button" data-t="auto">◐</button>
      </div>
      <div class="seg" id="lang" role="group">
        <button type="button" data-l="zh">中</button>
        <button type="button" data-l="en">EN</button>
      </div>
      <span class="basemap">Basemap: OpenFreeMap</span>
    </div>
    <div class="mlegend" id="mlegend" hidden></div>
    <section class="mini-analysis" id="mini-analysis" aria-live="polite"></section>
  </div>

  <aside class="side" id="side">
    <section class="card" id="card" data-i18n-aria="filters">
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="days" id="days" role="group"></div>
      <div class="label" data-i18n="topic"></div>
      <div class="topics" id="domain" role="group"></div>
      <label class="check"><input type="checkbox" id="openOnly"><span data-i18n="openOnly"></span></label>
      <div class="meta"><p data-i18n-html="meta1"></p><p data-i18n="meta2"></p></div>
    </section>
    <div class="side-top">
      <input class="search" id="q" type="search" autocomplete="off">
    </div>

    <div class="pane" id="pane-events">
      <div class="side-head">
        <div class="count" id="count" aria-live="polite"></div>
        <div class="chips" id="chips"></div>
        <div class="bar" id="bar"></div>
        <div class="legend" id="legend"></div>
        <div class="offnote" id="offnote"></div>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="pane" id="pane-insights">
      <div class="insights">
        <h2 data-i18n="tabInsights"></h2>
        <div class="facts" id="facts"></div>
        <div class="sec">
          <div class="hourhead">
            <h2 id="hourtitle"></h2>
            <div style="display:flex;gap:6px">
              <button type="button" class="btn" id="allday" data-i18n="allDay"></button>
              <button type="button" class="btn primary" id="play"></button>
            </div>
          </div>
          <svg class="hours" id="hours" viewBox="0 0 380 150" role="img"></svg>
          <p class="hint" data-i18n="hourNote"></p>
        </div>
        <div class="sec">
          <h2 data-i18n="liftTitle"></h2>
          <p class="hint" data-i18n="liftDesc"></p>
          <div class="tblwrap"><table class="hm" id="heat"></table></div>
          <p class="hint" style="margin-top:8px" data-i18n="liftBasis"></p>
        </div>
      </div>
    </div>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
(() => {
  const TW = window.TW;

  // ---------- i18n ----------
  const DOMAIN_ZH = {
    "AI": "人工智能", "B2B": "企业对企业", "Fundraising / Investing": "融资 / 投资", "Engineering": "工程技术",
    "Deep Tech": "深科技", "GTM": "市场进入", "B2C / Consumer": "消费市场", "Infrastructure": "基础设施",
    "SaaS": "软件服务", "Healthcare / Healthtech": "医疗健康", "Fintech": "金融科技", "Creators": "创作者",
    "Media / Entertainment": "媒体 / 娱乐", "Hardware": "硬件", "International / Expansion": "国际化 / 扩张",
    "HR / Hiring": "人力 / 招聘", "Women-focused": "女性主题", "Cybersecurity": "网络安全",
    "Defense": "国防", "Climate": "气候", "Crypto / Web3": "加密 / Web3", "Gaming": "游戏", "AR / VR": "增强 / 虚拟现实",
  };
  const I18N = {
    zh: {
      pageTitle: "SF Tech Week 活动地图", htmlLang: "zh-CN",
      eyebrow: "SF Tech Week · 2026.10.05—10.11",
      title: (n) => `SF Tech Week 2026 · ${n} 场活动在哪里`,
      filters: "筛选", allWeek: "全周", days7: "7 天", days: ["周一", "周二", "周三", "周四", "周五", "周六", "周日"],
      topic: "官方主题 · 23", allTopics: "全部主题", openOnly: "只看仍可报名",
      more: "更多筛选 ▾", less: "收起 ▴",
      meta1: "地图标记显示主办方填写的<strong>街区</strong>，位置为街区中心；缩小时相邻街区会合并。",
      meta2: "“East Bay”只有地区、没有城市，位置放在奥克兰作示意。",
      light: "浅色", dark: "深色", auto: "跟随系统", theme: "配色", language: "语言",

      const f = e.features[0], p = f.properties;
      const lift = state.domain >= 0 && p.t >= MIN_N_FOR_LIFT ? T.popLift(((p.n / p.t) / stats.ratio).toFixed(2)) : "";
      const txt = p.cluster ? T.popCluster(p.n, p.point_count) : T.popHood(esc(p.name), p.n, lift);
      popup.setLngLat(f.geometry.coordinates).setHTML(`<div class="pop">${txt}</div>`).addTo(map);
    });
    map.on("mouseleave", "bub", () => { map.getCanvas().style.cursor = ""; popup.remove(); });
    map.on("click", "bub", async (e) => {
      const f = e.features[0];
      if (f.properties.cluster) {
        const z = await map.getSource("hoods").getClusterExpansionZoom(f.properties.cluster_id);
        map.easeTo({ center: f.geometry.coordinates, zoom: z + 0.2 });
      } else {
        selectHood(f.properties.i);
      }
    });
  }

  function selectHood(i) {
    state.hood = state.hood === i ? null : i;
    state.shown = PAGE;
    syncSelected();
    redrawSide();
  }
  function syncSelected() {
    if (map && map.getLayer("bub-sel")) map.setFilter("bub-sel", ["==", ["get", "i"], state.hood ?? -1]);
  }
  function highlight(i) {
    const src = map && map.getSource("hl");
    if (!src) return;
    src.setData({ type: "FeatureCollection", features: i === null || !hoods[i].ll ? [] : [{ type: "Feature", geometry: { type: "Point", coordinates: hoods[i].ll } }] });
  }

  function drawMapLegend() {
    const box = $("mlegend");
    if (state.domain < 0 || !map) { box.hidden = true; return; }
    const vars = ["--lift-hi", "--lift-hi-soft", "--lift-mid", "--lift-lo-soft", "--lift-lo"];
    const anySig = showSig() && Object.values(sigByHood).some((ds) => ds.includes(TW.themes[state.domain]));
    box.hidden = false;
    box.innerHTML = `<b>${esc(T.mlTitle(dName(TW.themes[state.domain])))}</b>
      <div class="sw">${vars.map((v, j) => `<span><i style="background:var(${v})"></i>${T.ml[j]}</span>`).join("")}
      <span><i style="background:var(--lift-mid);opacity:.55"></i>${T.ml[5]}</span></div>
      ${anySig ? `<div class="sw ring"><span><i></i>${T.mlRing}</span></div>` : ""}`;
  }

  // ---------- events pane ----------
  function inView(e) {
    if (state.hood !== null) return e[0] === state.hood;
    if (!map) return true;
    const h = hoods[e[0]];
    if (!h.ll) return state.includeOff;
    return map.getBounds().contains(h.ll);
  }
  let lastList = null;
  function drawBar(list) {
    list = list || lastList;
    if (!list) return;
    const c = {};
    list.forEach((e) => (c[e[7]] = (c[e[7]] || 0) + 1));
    const tot = list.length || 1;
    $("bar").innerHTML = STATUS.filter(([k]) => c[k]).map(([k, v]) => `<i style="flex:${c[k] / tot};background:var(${v})"></i>`).join("");
    $("legend").innerHTML = STATUS.filter(([k]) => c[k]).map(([k, v]) => `<span><i class="dot" style="background:var(${v})"></i>${T.status[k]}<b>${c[k]}</b></span>`).join("");
  }
  function drawChips() {
    const chips = [];
    if (state.hood !== null) chips.push([T.chipHood(esc(hoods[state.hood].name)), () => selectHood(state.hood)]);
    if (state.hour !== null) chips.push([T.chipHour(state.hour), () => { stopPlay(); state.hour = null; update(); }]);
    $("chips").innerHTML = chips.map(([t], j) => `<span class="chip">${t}<button type="button" data-j="${j}" aria-label="${T.clear}">×</button></span>`).join("");
    $("chips").querySelectorAll("button").forEach((b) => (b.onclick = chips[+b.dataset.j][1]));
  }
  function drawSide() {
    const base = [];
    for (let i = 0; i < ev.length; i++) if (passes(i)) base.push(i);
    const list = base.filter((i) => inView(ev[i])).map((i) => ev[i])
      .sort((a, b) => a[1] - b[1] || (a[2] < 0) - (b[2] < 0) || a[6].localeCompare(b[6]) || a[4].localeCompare(b[4]));
    lastList = list;
    const where = state.hood !== null ? T.inHood(esc(hoods[state.hood].name)) : !map ? "" : state.includeOff ? T.inViewOff : T.inView;
    $("count").innerHTML = T.count(fmt(list.length), where);
    drawChips();
    drawBar(list);
    const off = base.filter((i) => !hoods[ev[i][0]].ll).length;
    $("offnote").innerHTML = state.hood === null && map && off
      ? (state.includeOff ? `${T.offIn(off)}<button type="button" id="offBtn">${T.offBtnOut}</button>`
        : `${T.offOut(off)}<button type="button" id="offBtn">${T.offBtnIn}</button>`)
      : "";
    const ob = $("offBtn");
    if (ob) ob.onclick = () => { state.includeOff = !state.includeOff; drawSide(); };

    const box = $("list");
    if (!list.length) { box.innerHTML = `<div class="empty">${T.empty}</div>`; return; }
    box.innerHTML = list.slice(0, state.shown).map((e) => `<a class="ev" href="${esc(e[8])}" target="_blank" rel="noopener" data-h="${e[0]}">
        <div class="name">${esc(e[4])}</div>
        <div class="tm"><b>${e[6]}</b><small>${T.days[e[1]]} ${DATES[e[1]]}</small></div>
        <div class="sub">${esc(e[5])} · ${esc(hoods[e[0]].name)}</div>
        <div class="st"><i class="dot" style="background:var(${STATUS_VAR[e[7]] || "--st-unknown"})"></i>${T.status[e[7]] || T.status.unknown}${e[2] < 0 ? `<span class="d">· ${T.suspect}</span>` : ""}</div>
      </a>`).join("") + (list.length > state.shown ? `<div class="more" id="more">${T.moreRows(state.shown, fmt(list.length))}</div>` : "");
    const more = $("more");
    if (more) new IntersectionObserver((ents, obs) => {
      if (ents[0].isIntersecting) { obs.disconnect(); state.shown += PAGE; const top = box.scrollTop; drawSide(); box.scrollTop = top; }
    }, { root: box }).observe(more);
  }
  $("list").addEventListener("pointerover", (e) => { const a = e.target.closest(".ev"); if (a) highlight(+a.dataset.h); });
  $("list").addEventListener("pointerleave", () => highlight(null));
  $("list").addEventListener("focusin", (e) => { const a = e.target.closest(".ev"); if (a) highlight(+a.dataset.h); });

  // ---------- insights pane ----------
  const tip = $("tip");
  const showTip = (evt, html) => { tip.innerHTML = html; tip.hidden = false; tip.style.left = evt.clientX + 12 + "px"; tip.style.top = evt.clientY - 44 + "px"; };
  const hideTip = () => (tip.hidden = true);
  function drawFacts() {
    const core = ev.filter((e) => CORE3.includes(hoods[e[0]].name)).length;
    const timed = ev.filter((e) => e[2] >= 0).length, peak = ev.filter((e) => e[2] === 17 || e[2] === 18).length;
    const sig = TW.themeLift.filter((L) => L.sig).length;
    $("facts").innerHTML = [
      [(100 * core / ev.length).toFixed(1) + "%", T.f1],
      [`${sig} / ${TW.themeLift.length}`, T.f2],
      [(100 * peak / timed).toFixed(1) + "%", T.f3],
    ].map(([b, s]) => `<div class="fact"><b>${b}</b><span>${s}</span></div>`).join("");
  }
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
  function drawHours() {
    const hs = $("hours");
    hs.textContent = "";
    const counts = [];
    for (let h = H0; h <= H1; h++) counts.push(0);
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      if (e[2] < H0 || e[2] > H1 || !passes(i, { useHour: false })) continue;
      if (state.hood !== null && e[0] !== state.hood) continue;
      counts[e[2] - H0]++;
    }
    const max = Math.max(1, ...counts);
    const nice = max <= 10 ? 10 : max <= 50 ? Math.ceil(max / 10) * 10 : Math.ceil(max / 50) * 50;
    const x0 = 32, x1 = 376, y0 = 124, y1 = 10, bw = (x1 - x0) / counts.length;
    [0, nice / 2, nice].forEach((v) => {
      const y = y0 - (v / nice) * (y0 - y1);
      svgEl("line", { x1: x0, x2: x1, y1: y, y2: y, class: "hgrid" }, hs);
      svgEl("text", { x: x0 - 5, y: y + 3.5, "text-anchor": "end", class: "axis" }, hs).textContent = v;
    });
    counts.forEach((c, j) => {
      const h = H0 + j, bh = (c / nice) * (y0 - y1);
      const r = svgEl("rect", {
        x: (x0 + j * bw + 1.5).toFixed(1), y: (y0 - bh).toFixed(1), width: (bw - 3).toFixed(1), height: Math.max(0, bh).toFixed(1), rx: 2,
        class: "hbar" + (state.hour === null || state.hour === h ? "" : " dim"), tabindex: 0, role: "button", "aria-label": T.hourAria(h, c),
      }, hs);
      const hit = svgEl("rect", { x: x0 + j * bw, y: y1, width: bw, height: y0 - y1, fill: "transparent", style: "cursor:pointer" }, hs);
      const pick = () => { stopPlay(); state.hour = state.hour === h ? null : h; update(); };
      [r, hit].forEach((n) => {
        n.addEventListener("click", pick);
        n.addEventListener("pointermove", (evt) => showTip(evt, T.hourTip(h, fmt(c))));
        n.addEventListener("pointerleave", hideTip);
      });
      r.addEventListener("keydown", (evt) => { if (evt.key === "Enter" || evt.key === " ") { evt.preventDefault(); pick(); } });
      if (h % 3 === 0) svgEl("text", { x: x0 + j * bw + bw / 2, y: y0 + 14, "text-anchor": "middle", class: "axis" }, hs).textContent = h;
    });
    svgEl("line", { x1: x0, x2: x1, y1: y0, y2: y0, stroke: "var(--ink-3)", "stroke-width": 1 }, hs);
    $("hours").setAttribute("aria-label", T.hourTitle(T.allDay));
    $("hourtitle").textContent = T.hourTitle(state.hour === null ? T.allDay : `${state.hour}:00–${state.hour}:59`) +
      (state.hood !== null ? ` · ${hoods[state.hood].name}` : "");
  }
  const liftBg = (l) => css(l >= 1.5 ? "--lift-hi" : l >= 1.15 ? "--lift-hi-soft" : l > 0.87 ? "--lift-mid" : l > 0.67 ? "--lift-lo-soft" : "--lift-lo");
  function drawHeat() {
    const byKey = {};
    TW.themeLift.forEach((L) => (byKey[L.hood + "|" + L.theme] = L));
    const hoodsH = [...new Set(TW.themeLift.map((L) => L.hood))].sort((a, b) => byKey[b + "|" + TW.themes[0]].n - byKey[a + "|" + TW.themes[0]].n);
    const order = TW.themes.map((d, i) => i).sort((a, b) => domCount[b] - domCount[a]);
    let html = "<thead><tr><th></th>" + hoodsH.map((h) => `<th scope="col">${esc(h)}<small>${byKey[h + "|" + TW.themes[0]].n}</small></th>`).join("") + "</tr></thead><tbody>";
    for (const di of order) {
      const d = TW.themes[di];
      html += `<tr class="${state.domain === di ? "cur" : ""}"><th scope="row" data-d="${di}" tabindex="0">${esc(dName(d))}</th>`;
      for (const h of hoodsH) {
        const L = byKey[h + "|" + d];
        if (L.k < 5) { html += `<td class="low">·</td>`; continue; }
        const cls = L.sig ? "sig" : (L.q < 0.10 && L.lift > 1 ? "near" : "");
        const strong = !isDark() && (L.lift >= 1.5 || L.lift <= 0.67);
        html += `<td class="${cls}" style="background-color:${liftBg(L.lift)};color:${strong ? "#fff" : "var(--ink)"}" title="${esc(T.liftCell(h, dName(d), L.k, L.n, L.lift.toFixed(2), L.q))}">${L.lift.toFixed(2)}</td>`;
      }
      html += "</tr>";
    }
    const tbl = $("heat");
    tbl.innerHTML = html + "</tbody>";
    tbl.querySelectorAll("tbody th").forEach((th) => {
      const go = () => { const d = +th.dataset.d; state.domain = state.domain === d ? -1 : d; update(); };
      th.onclick = go;
      th.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    });
  }
  function drawInsights() { drawFacts(); drawHours(); drawHeat(); }
  function drawMiniAnalysis() {
    const box = $("mini-analysis");
    if (state.domain < 0) {
      box.innerHTML = `<h2>${state.lang === "zh" ? "主题速览" : "Topic overview"}</h2><p>${state.lang === "zh" ? "选择左侧任一官方主题，查看哪些街区更集中。" : "Choose an official topic on the left to see where it concentrates."}</p>`;
      return;
    }
    const theme = TW.themes[state.domain];
    const rows = TW.themeLift.filter((L) => L.theme === theme && L.k >= 5).sort((a, b) => b.lift - a.lift).slice(0, 3);
    box.innerHTML = `<h2>${esc(dName(theme))} · ${state.lang === "zh" ? "街区分布" : "by neighborhood"}</h2>` +
      (rows.length ? rows.map((L) => `<div class="mini-row"><span>${esc(L.hood)}${L.sig ? " ◎" : ""}</span><b>${L.lift.toFixed(2)}×</b></div>`).join("") : `<p>${state.lang === "zh" ? "暂无足够样本" : "Not enough observations"}</p>`) +
      `<p>${state.lang === "zh" ? "相对集中度：1.00× 为全城平均；◎ 为统计显著。基于全周数据。" : "Relative concentration: 1.00× is citywide average; ◎ is significant. Full-week data."}</p>`;
  }

  const playBtn = $("play");
  function stopPlay() {
    if (state.playing) { clearInterval(state.playing); state.playing = null; playBtn.textContent = T.play; }
  }
  playBtn.onclick = () => {
    if (state.playing) { stopPlay(); return; }
    state.hour = state.hour === null || state.hour >= H1 ? H0 : state.hour;
    playBtn.textContent = T.pause;
    update();
    state.playing = setInterval(() => {
      if (state.hour >= H1) { stopPlay(); return; }
      state.hour++; update();
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 1400 : 800);
  };
  $("allday").onclick = () => { stopPlay(); state.hour = null; update(); };

  // ---------- update loop ----------
  function redrawSide() { drawSide(); drawInsights(); drawMiniAnalysis(); }
  function update() {
    document.querySelectorAll("#days button").forEach((b, j) => b.setAttribute("aria-pressed", j - 1 === state.day));
    document.querySelectorAll("#domain button").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.d === state.domain));
    state.shown = PAGE;
    stats = hoodStats();
    if (map && map.getSource("hoods")) { map.getSource("hoods").setData(hoodGeoJSON()); paintBubbles(); }
    drawMapLegend();
    redrawSide();
  }
  stats = hoodStats();
  applyLang();
  setTheme(themePref());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (themePref() === "auto") setTheme("auto"); });
  update();
})();
</script>
